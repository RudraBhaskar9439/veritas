[project]
name = "veritas-runtime"
version = "0.1.0"
description = "Versioned service runtime for Veritas"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas_runtime"]


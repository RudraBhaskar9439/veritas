[project]
name = "veritas-runtime"
version = "0.1.0"
description = "Versioned service runtime for Veritas"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "cloud-sql-python-connector[asyncpg]>=1.18,<2",
  "fastapi>=0.116,<1",
  "google-cloud-kms>=3.5,<4",
  "google-cloud-storage>=3.2,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veritas_runtime"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veritas
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: local-only-veritas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - veritas-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
    environment:
      VERITAS_ENVIRONMENT: local
    command: ["uvicorn", "veritas_runtime.api:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "8080:8080"

  ingress:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
    environment:
      VERITAS_ENVIRONMENT: local
    command: ["uvicorn", "veritas_runtime.ingress:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "8081:8080"

  worker:
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
    environment:
      VERITAS_ENVIRONMENT: local
    command: ["uvicorn", "veritas_runtime.worker:app", "--host", "0.0.0.0", "--port", "8080", "--no-access-log"]
    ports:
      - "8082:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:8080"

volumes:
  veritas-postgres:

